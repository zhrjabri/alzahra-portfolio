# Render blueprint for the contact-form backend.
# The Next.js frontend stays on Vercel; only backend/ is deployed here.
#
# Deploy: render.com -> New -> Blueprint -> pick this repo. Render reads this
# file, then prompts for the values marked sync:false (they are secrets or
# depend on the final URLs, so they are never committed).
services:
  - type: web
    name: alzahra-portfolio-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    # Render sets $PORT; gunicorn must bind 0.0.0.0, not 127.0.0.1.
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 60
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.7"
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_TIMEOUT
        value: "20"
      # Gmail account that sends the mail, and the 16-char App Password.
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      # Inbox that receives contact-form messages.
      - key: MAIL_TO
        sync: false
      # Comma-separated origins allowed to call the API — the Vercel site.
      - key: ALLOWED_ORIGINS
        sync: false
      # Public URL of this service, once Render assigns it.
      - key: API_BASE_URL
        sync: false
