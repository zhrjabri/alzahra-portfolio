<!doctype html><html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:1200px;height:630px;overflow:hidden}
  body{background:#F7F5F0;position:relative;font-family:Inter,system-ui}
  .fade{position:absolute;inset:0;background:linear-gradient(to bottom,rgba(27,58,107,.08),transparent 60%)}
  .lock{position:absolute;left:80px;top:60px;color:#1B3A6B}
  .arcs{position:absolute;right:-118px;top:50%;transform:translateY(-50%);width:660px;height:660px}
  .arcs svg{position:absolute;inset:0}
  .mark{position:absolute;right:118px;top:50%;transform:translateY(-50%);color:#1B3A6B}
  .copy{position:absolute;left:80px;top:54%;transform:translateY(-50%);max-width:706px}
  .eyebrow{font-family:'JetBrains Mono',monospace;font-size:15px;font-weight:500;
           letter-spacing:.28em;text-transform:uppercase;color:#1B3A6B;margin-bottom:22px}
  h1{font-family:'Space Grotesk',sans-serif;font-weight:600;font-size:76px;line-height:1.04;
     letter-spacing:-.025em;color:#17202B}
  .role{font-size:24px;white-space:nowrap;line-height:1.4;margin-top:26px;color:#556170}
  .role b{font-weight:500;color:#1B3A6B}
  .tag{font-size:19px;color:#8A94A2;margin-top:14px}
  .foot{position:absolute;left:80px;bottom:56px;font-family:'JetBrains Mono',monospace;
        font-size:14px;letter-spacing:.16em;text-transform:uppercase;color:#8A94A2}
  .bar{position:absolute;left:0;bottom:0;width:100%;height:6px;
       background:linear-gradient(90deg,#1B3A6B 0%,#1B3A6B 34%,#157F77 34%,#157F77 46%,#E0DAD0 46%)}
</style></head><body>
<div class="fade"></div>

<svg class="lock" width="132" height="88" viewBox="0 0 150 100" fill="none"
     stroke="currentColor" stroke-width="3.4" stroke-linejoin="miter">
  <g transform="translate(75 41) scale(1.35) translate(-49.75 -50)">
    <path d="M26 67 L37 33 L48 67"/><path d="M29.9 55 H44.1"/>
    <path d="M22.5 67 H29.5"/><path d="M44.5 67 H51.5"/>
    <path d="M57 33 H77 L57 67 H77"/><path d="M57 33 V37.5"/><path d="M77 67 V62.5"/>
  </g>
  <path d="M33 81 H117" stroke-width="2.89"/>
</svg>

<div class="arcs">
  <svg viewBox="0 0 100 100" style="opacity:.42">
    <circle cx="50" cy="50" r="46" fill="none" stroke="#1B3A6B" stroke-width="0.4" stroke-dasharray="1 3"/>
  </svg>
  <svg viewBox="0 0 100 100" style="opacity:.45">
    <circle cx="50" cy="50" r="34" fill="none" stroke="#157F77" stroke-width="0.3" stroke-dasharray="0.5 2.5"/>
  </svg>
</div>


<div class="copy">
  <div class="eyebrow">Sultanate of Oman</div>
  <h1>Alzahra Ali<br>Nasser Al Jabri</h1>
  <div class="role"><b>Artificial Intelligence Graduate</b> &middot; AI &amp; Software Developer</div>
  <div class="tag">Building intelligent, practical solutions with AI, Python,<br>and modern software technologies.</div>
</div>

<div class="foot">AI &nbsp;&middot;&nbsp; Python &nbsp;&middot;&nbsp; API-driven software</div>
<div class="bar"></div>
</body></html>
